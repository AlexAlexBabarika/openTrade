services:
  postgres:
    image: postgres:16.14-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opentrade}
      POSTGRES_USER: ${POSTGRES_USER:-opentrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opentrade}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  opentrade:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENTRADE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-opentrade}:${POSTGRES_PASSWORD:-opentrade}@postgres:5432/${POSTGRES_DB:-opentrade}
      OPENTRADE_SECRETS_FILE: /app/data/secrets.json
      JWT_SECRET: ${JWT_SECRET:-}
      API_KEYS_ENCRYPTION_KEY: ${API_KEYS_ENCRYPTION_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-12582912}
      WS_MAX_MESSAGE_BYTES: ${WS_MAX_MESSAGE_BYTES:-65536}
      WS_MAX_CONNECTIONS_PER_IP: ${WS_MAX_CONNECTIONS_PER_IP:-20}
      WS_MAX_MESSAGES_PER_MINUTE: ${WS_MAX_MESSAGES_PER_MINUTE:-120}
      WS_MAX_SUBSCRIPTIONS: ${WS_MAX_SUBSCRIPTIONS:-20}
      MAX_CONCURRENT_SWEEPS: ${MAX_CONCURRENT_SWEEPS:-2}
      MAX_MARKET_OHLCV_CANDLES: ${MAX_MARKET_OHLCV_CANDLES:-8000}
      MARKET_RATE_LIMIT_MAX: ${MARKET_RATE_LIMIT_MAX:-120}
      MARKET_RATE_LIMIT_WINDOW_SEC: ${MARKET_RATE_LIMIT_WINDOW_SEC:-60}
      SEED_SYMBOLS_ON_STARTUP: ${SEED_SYMBOLS_ON_STARTUP:-1}
      SYMBOL_SEED_PROVIDERS: ${SYMBOL_SEED_PROVIDERS:-binance}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  app_data:
