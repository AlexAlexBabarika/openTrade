version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-development:
        dependency-type: development
    open-pull-requests-limit: 4
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      container-bases:
        patterns: ["*"]
    open-pull-requests-limit: 2
